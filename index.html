          if (isNaN(secs) || secs === 0) return '0:00';

      const ytId = getYouTubeVideoId(trimmed);

        return 'https://www.youtube.com/embed/' + ytId + '?enablejsapi=1&autoplay=1&loop=0&controls=1&rel=0&modestbranding=1';
      }
      const vimeoMatch = trimmed.match(/vimeo\.com\/(?:video\/)?([0-9]+)/i);
      if (vimeoMatch && vimeoMatch[1]) {
        return 'https://player.vimeo.com/video/' + vimeoMatch[1] + '?autoplay=1&api=1';

      return trimmed;

              }
            } else if (typeof ev.data === 'object' && ev.data !== null) {
              if ((ev.data.event === 'onStateChange' && ev.data.info === 0) || ev.data.event === 'ended' || ev.data.type === 'ended') {
                triggerEndedOnce();
              }
            }
          } catch(e) {}
        });
      }, 50);

      return container;
    }

    function runChatStep(stepIdx) {
      if (!config.flow || stepIdx >= config.flow.length) return;

      const step = config.flow[stepIdx];
      const typingIndicator = document.getElementById('typing-indicator');
      const messagesList = document.getElementById('messages-list');

      typingIndicator.classList.remove('hidden');
      typingIndicator.classList.add('flex');
      scrollToBottom();

      const delay = step.delay !== undefined ? step.delay : 1500;

      if (currentTimer) clearTimeout(currentTimer);

      currentTimer = setTimeout(function() {
        typingIndicator.classList.remove('flex');
        typingIndicator.classList.add('hidden');

        if (step.isAudio && step.audioUrl) {
          const nextIdx = step.next !== undefined ? step.next : stepIdx + 1;
          const audioBubble = createAudioBubble(step.audioUrl, function() {
            if (nextIdx < config.flow.length) {
              setTimeout(function() {
                runChatStep(nextIdx);
              }, 800);
            }
          });
          messagesList.appendChild(audioBubble);
        } else if (step.isVideo) {
          const nextIdx = step.next !== undefined ? step.next : stepIdx + 1;
          const videoBubble = createVideoBubble(step, function() {
            if (nextIdx < config.flow.length) {
              setTimeout(function() {
                runChatStep(nextIdx);
              }, 700);
            }
          });
          messagesList.appendChild(videoBubble);
        } else {
          const botBubble = document.createElement('div');
          botBubble.className = 'flex items-end self-start space-x-2 my-1 animate-pop-in max-w-[92%] sm:max-w-md';
          const innerContent = '<div class="text-neutral-100 text-sm leading-relaxed whitespace-pre-line">' + step.message + '</div>';

          botBubble.innerHTML = '<img src="' + config.avatarUrl + '" alt="Avatar" class="w-7 h-7 rounded-full flex-shrink-0 object-cover border border-[#333] mb-0.5" />' +
            '<div class="bg-[#262626] border border-[#333]/50 rounded-2xl rounded-bl-sm p-3.5 text-white text-sm shadow-md overflow-hidden w-full">' + innerContent + '</div>';

          messagesList.appendChild(botBubble);
        }

        safeCreateIcons();
        scrollToBottom();

        // 1. If options present, show options
        if (step.options && step.options.length > 0) {
          setTimeout(function() {
            renderOptions(step.options);
          }, 300);
        }
        // 2. If audio, waiting for audio end callback
        else if (step.isAudio) {
          // Audio callback handles advancing
        }
        // 3. If video, waiting for video completion callback
        else if (step.isVideo) {
          // Video callback handles advancing
        }
        // 4. Regular message auto-advance
        else {
          const nextIdx = step.next !== undefined ? step.next : stepIdx + 1;
          if (nextIdx < config.flow.length) {
            runChatStep(nextIdx);
          }
        }
      }, delay);
    }

    function startChat() {
      if (currentTimer) clearTimeout(currentTimer);
      document.getElementById('messages-list').innerHTML = '';
      document.getElementById('options-container').classList.add('hidden');
      setTimeout(function() {
        runChatStep(0);
      }, 400);
    }

    window.addEventListener('DOMContentLoaded', function() {
      safeCreateIcons();
      startChat();
    });
  </script>
</body>
</html>
